<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maya - Subtitle app</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202124;background:#f5f6f8;--accent:#4f46e5;--border:#e5e7eb;--muted:#6b7280}
    *{box-sizing:border-box}body{margin:0;padding:28px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--border);border-radius:10px;background:#fff;padding:9px 13px}button:hover{border-color:var(--accent)}button:disabled{opacity:.55;cursor:not-allowed}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.primary:hover{background:#4338ca;color:#fff}.app{max-width:1400px;margin:auto;display:grid;gap:18px}.header,.panel{background:#fff;border:1px solid #eceef2;border-radius:18px;padding:20px}.header{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:21px;font-weight:700}.muted{color:var(--muted);font-size:13px}.settings{display:grid;grid-template-columns:minmax(220px,1.3fr) minmax(160px,.8fr) minmax(160px,.8fr);gap:12px}.field{display:grid;gap:7px;font-size:13px;font-weight:600}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff;min-width:0}.field textarea{resize:vertical;min-height:76px}.file-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.filename{font-size:13px;color:var(--muted);overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.progress{height:7px;background:#eef0f4;border-radius:99px;overflow:hidden;margin-top:14px}.progress>div{height:100%;width:0;background:var(--accent);transition:width .2s}.status{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:13px;color:var(--muted)}.table-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.table-head h2{font-size:17px;margin:0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th{text-align:left;color:var(--muted);font-size:12px;font-weight:600;padding:10px;border-bottom:1px solid var(--border)}td{padding:8px 10px;border-bottom:1px solid #f0f1f4;vertical-align:top;font-size:13px}td[contenteditable="true"]{min-width:220px;outline:none;border-radius:6px}td[contenteditable="true"]:focus{background:#f4f3ff;box-shadow:inset 0 0 0 1px var(--accent)}td.time{font-family:ui-monospace,monospace;white-space:nowrap;color:#555;font-size:12px}td button{padding:6px 9px;font-size:12px;white-space:nowrap}.empty{text-align:center;padding:36px;color:var(--muted)}@media(max-width:800px){body{padding:12px}.header{align-items:flex-start;flex-direction:column}.settings{grid-template-columns:1fr}.panel{padding:14px}}
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <div><div class="brand">Maya</div><div class="muted">Local transcription and subtitle translation</div></div>
    <div class="actions"><button id="export-btn" onclick="exportSRT()">Export .SRT</button><button class="primary" id="run-btn" onclick="runFullPipeline()">Start Processing</button></div>
  </header>

  <section class="panel">
    <div class="file-row">
      <button onclick="pickVideoFile()">Select Video</button>
      <span class="filename" id="video-filename">No file selected</span>
    </div>
    <div class="settings" style="margin-top:18px">
      <label class="field">Ollama Model<select id="ollama-model-select"><option value="qwen2.5:7b">qwen2.5:7b</option><option value="llama3.1:8b">llama3.1:8b</option></select></label>
      <label class="field">Target Language<select id="target-lang-select"><option value="Russian">Russian</option><option value="English">English</option><option value="Spanish">Español</option><option value="German">Deutsch</option><option value="Japanese">日本語</option><option value="Chinese">中文</option></select></label>
      <label class="field">Custom Prompt<input id="custom-prompt-input" placeholder="Terms, style, tone…"></label>
    </div>
    <div class="progress"><div id="progress-bar"></div></div>
    <div class="status"><span id="pipeline-status-text">Select a video to start.</span><span id="progress-label">0%</span></div>
  </section>

  <section class="panel">
    <div class="table-head"><h2>Subtitles <span class="muted" id="rows-count">0 rows</span></h2><div class="actions"><button onclick="addEmptySubtitleRow()">+ Add Row</button></div></div>
    <div class="table-wrap"><table><thead><tr><th>Timecode</th><th>Original</th><th>Translation</th><th></th></tr></thead><tbody id="subtitles-tbody"><tr><td colspan="4" class="empty">Subtitles will appear here after processing the video.</td></tr></tbody></table></div>
  </section>
</div>
<script>
  let selectedVideoPath = null;
  let subtitlesData = [];

  window.addEventListener('pywebviewready', async () => {
    try {
      const info = await window.pywebview.api.get_system_info();
      const select = document.getElementById('ollama-model-select');
      if (Array.isArray(info.ollama_models) && info.ollama_models.length) {
        select.innerHTML = info.ollama_models.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
      }
    } catch (e) { console.info('Browser preview mode'); }
  });

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  function renderWorkspace() {
    const tbody = document.getElementById('subtitles-tbody');
    tbody.replaceChildren();
    if (!subtitlesData.length) {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td colspan="4" class="empty">Subtitles will appear here after processing the video.</td>';
      tbody.appendChild(tr);
    }
    subtitlesData.forEach((seg, idx) => {
      const tr = document.createElement('tr');
      const time = document.createElement('td'); time.className = 'time';
      time.textContent = `${seg.start || ''}\n${seg.end || ''}`;
      const source = makeEditableCell(seg.source, value => subtitlesData[idx].source = value);
      const translation = makeEditableCell(seg.translation, value => subtitlesData[idx].translation = value);
      const action = document.createElement('td');
      const btn = document.createElement('button'); btn.textContent = '↻ Translate'; btn.title = 'Retranslate row'; btn.onclick = () => retranslateRow(idx);
      action.appendChild(btn); tr.append(time, source, translation, action); tbody.appendChild(tr);
    });
    document.getElementById('rows-count').textContent = `${subtitlesData.length} rows`;
  }

  function makeEditableCell(value, onUpdate) {
    const td = document.createElement('td'); td.contentEditable = 'true'; td.textContent = value || '';
    td.addEventListener('input', () => onUpdate(td.innerText.trim()));
    return td;
  }

  async function pickVideoFile() {
    if (!window.pywebview) { setStatus('File selection is available in the app running via pywebview.'); return; }
    try {
      const fileInfo = await window.pywebview.api.select_video_file();
      if (!fileInfo) return;
      selectedVideoPath = fileInfo.path;
      document.getElementById('video-filename').textContent = `${fileInfo.name} · ${fileInfo.size_mb} MB`;
      setStatus('Video selected. Ready to start processing.');
    } catch (e) { setStatus(`Failed to select video: ${e.message || e}`); }
  }

  async function runFullPipeline() {
    if (!window.pywebview) { setStatus('Processing is available in the app running via pywebview.'); return; }
    if (!selectedVideoPath) { await pickVideoFile(); if (!selectedVideoPath) return; }
    const btn = document.getElementById('run-btn'); btn.disabled = true;
    try {
      await window.pywebview.api.start_pipeline(selectedVideoPath,
        document.getElementById('ollama-model-select').value,
        document.getElementById('target-lang-select').value,
        document.getElementById('custom-prompt-input').value);
    } catch (e) { setStatus(`Start error: ${e.message || e}`); btn.disabled = false; }
  }

  window.updatePipelineStatus = function(payload) {
    const progress = Math.max(0, Math.min(100, Number(payload.progress) || 0));
    document.getElementById('progress-bar').style.width = `${progress}%`;
    document.getElementById('progress-label').textContent = `${progress}%`;
    setStatus(payload.message || payload.step || 'Processing…');
    if (payload.step === 'done' || payload.step === 'error') document.getElementById('run-btn').disabled = false;
  };

  window.loadSubtitles = function(segments) { subtitlesData = Array.isArray(segments) ? segments : []; renderWorkspace(); };
  window.updateSubtitleRow = function(index, seg) { if (index >= 0 && index < subtitlesData.length) { subtitlesData[index] = seg; renderWorkspace(); } };

  async function retranslateRow(idx) {
    if (!window.pywebview) { setStatus('Translation is available in the app running via pywebview.'); return; }
    const seg = subtitlesData[idx]; if (!seg) return;
    setStatus(`Translating row ${idx + 1}…`);
    try {
      const res = await window.pywebview.api.retranslate_single_row(idx, seg.source, document.getElementById('ollama-model-select').value,
        document.getElementById('target-lang-select').value, document.getElementById('custom-prompt-input').value);
      if (res) { subtitlesData[idx].translation = res.translation; renderWorkspace(); setStatus(`Row ${idx + 1} updated · ${res.latency_ms} ms`); }
    } catch (e) { setStatus(`Translation error: ${e.message || e}`); }
  }

  function addEmptySubtitleRow() {
    const id = subtitlesData.reduce((max, seg) => Math.max(max, Number(seg.id) || 0), 0) + 1;
    subtitlesData.push({id, start:'00:00:00,000', end:'00:00:00,000', duration:0, source:'', translation:''});
    renderWorkspace();
  }

  async function exportSRT() {
    if (!window.pywebview) { setStatus('Export is available in the app running via pywebview.'); return; }
    try {
      const res = await window.pywebview.api.export_srt_file(subtitlesData);
      if (res && res.saved) setStatus(`File saved: ${res.path}`);
    } catch (e) { setStatus(`Export error: ${e.message || e}`); }
  }

  function setStatus(message) { document.getElementById('pipeline-status-text').textContent = message; }
  renderWorkspace();
</script>
</body>
</html>
